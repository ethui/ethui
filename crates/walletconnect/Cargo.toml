[package]
name = "ethui-walletconnect"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
authors.workspace = true

[dependencies]
relay_client = { git = "https://github.com/reown-com/reown-rust", rev = "82279ed8302f2e0c7f919c07cdc7eeb5413ed511" }
relay_rpc    = { git = "https://github.com/reown-com/reown-rust", rev = "82279ed8302f2e0c7f919c07cdc7eeb5413ed511" }

# crypto — these are independent of the workspace rand 0.9
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf         = "0.12"
sha2         = "0.10"
hex          = "0.4"
base64       = "0.22"
rand_core    = { version = "0.6", features = ["getrandom"] }
zeroize.workspace = true

# ethui internal
ethui-rpc.workspace        = true
jsonrpc-core.workspace     = true
ethui-dialogs.workspace    = true
ethui-wallets.workspace    = true
ethui-broadcast.workspace  = true
ethui-types.workspace      = true
ethui-crypto.workspace     = true
ethui-settings.workspace   = true

# shared workspace deps
tokio.workspace       = true
tauri.workspace       = true
serde.workspace       = true
serde_json.workspace  = true
tracing.workspace     = true
thiserror.workspace   = true
url.workspace         = true
async-trait.workspace = true
color-eyre.workspace  = true
futures.workspace     = true
