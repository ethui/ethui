[advisories]
yanked = "warn"
ignore = [
  # proc-macro-error is unmaintained
  "RUSTSEC-2024-0370",
  # atk is unmaintained
  "RUSTSEC-2024-0413",
  # atk-sys is unmaintained
  "RUSTSEC-2024-0416",
  # gdk is unmaintained
  "RUSTSEC-2024-0412",
  # gdk-sys is unmaintained
  "RUSTSEC-2024-0418",
  # gdkwayland-sys is unmaintained
  "RUSTSEC-2024-0411",
  # gdkx11 is unmaintained
  "RUSTSEC-2024-0417",
  # gdkx11-sys is unmaintained
  "RUSTSEC-2024-0414",
  # gtk3 is unmaintained
  "RUSTSEC-2024-0415",
  # gtk3-sys is unmaintained
  "RUSTSEC-2024-0420",
  # gtk3-macros is unmaintained
  "RUSTSEC-2024-0419",
  # paste is unmaintained
  "RUSTSEC-2024-0436",
  # fxhash unmaintained
  "RUSTSEC-2025-0057",
  # unic-ucd-version
  "RUSTSEC-2025-0098",
  # unic-ucd-ident
  "RUSTSEC-2025-0100",
  # unic-ucd-common
  "RUSTSEC-2025-0080",
  # unic-char-range
  "RUSTSEC-2025-0075",
  # unic-char-property
  "RUSTSEC-2025-0081",
  # ruint
  "RUSTSEC-2025-0137",
  # ring 0.16 is unmaintained, pulled in transitively via jsonwebtoken (relay_rpc, walletconnect relay auth)
  "RUSTSEC-2025-0010",
  # ring 0.16 AES panic, same jsonwebtoken/relay_rpc pin as RUSTSEC-2025-0010
  "RUSTSEC-2025-0009",
  # proc-macro-error2 is unmaintained, no safe upgrade available
  "RUSTSEC-2026-0173",
  # quick-xml DoS, pulled in transitively via wayland-scanner (arboard clipboard support);
  # fix requires wayland-scanner's next major release
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]


[licenses]
allow = [
  "MIT",
  "Unlicense",
  "ISC",
  "CDLA-Permissive-2.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "OpenSSL",
  "MPL-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "Zlib",
]

[sources]
allow-git = [
  "https://github.com/tauri-apps/fix-path-env-rs",
  "https://github.com/reown-com/reown-rust",
]

# ring's LICENSE mixes multiple license texts that cargo-deny can't parse into
# a single SPDX expression; pulled in transitively via jsonwebtoken (relay_rpc).
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
